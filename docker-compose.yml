version: "3.9"

services:

  postgres:
    image: postgres:15
    container_name: ai_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_engineer

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant
    container_name: ai_qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7
    container_name: ai_redis

    ports:
      - "6379:6379"

volumes:
  postgres_data:
  qdrant_data:
